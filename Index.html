<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>LabourPro — WMS Labour Management</title>
<style>
/* ==== css/tokens.css ==== */
/* ==========================================================================
   LabourPro — Design Tokens
   ========================================================================== */
:root{
  /* ---- Surfaces ---- */
  --bg:              #06070C;
  --bg-raised:       #08090F;
  --surface:         rgba(255,255,255,0.045);
  --surface-hover:   rgba(255,255,255,0.065);
  --surface-strong:  rgba(255,255,255,0.09);
  --border:          rgba(255,255,255,0.09);
  --border-soft:     rgba(255,255,255,0.055);
  --border-strong:   rgba(255,255,255,0.14);

  /* ---- Accents ---- */
  --accent:          #7C6FFF;
  --accent-dim:      #5B4FD9;
  --accent-soft:     rgba(124,111,255,0.14);
  --accent-2:        #2DD4BF;
  --accent-2-soft:   rgba(45,212,191,0.14);

  /* ---- Semantic ---- */
  --success:         #34D399;
  --success-soft:    rgba(52,211,153,0.14);
  --warning:         #FBBF24;
  --warning-soft:    rgba(251,191,36,0.14);
  --error:           #F87171;
  --error-soft:      rgba(248,113,113,0.14);
  --info:            #60A5FA;
  --info-soft:       rgba(96,165,250,0.14);

  /* ---- Text ---- */
  --text-primary:    rgba(255,255,255,0.92);
  --text-secondary:  rgba(255,255,255,0.60);
  --text-tertiary:   rgba(255,255,255,0.38);
  --text-disabled:   rgba(255,255,255,0.24);
  --text-on-accent:  #06070C;

  /* ---- Typography ---- */
  --font-ui:   'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --font-mono: 'IBM Plex Mono', 'SF Mono', ui-monospace, monospace;

  --fs-2xs: 10.5px;
  --fs-xs:  11.5px;
  --fs-sm:  12.5px;
  --fs-md:  13.5px;
  --fs-base:14.5px;
  --fs-lg:  16px;
  --fs-xl:  19px;
  --fs-2xl: 24px;
  --fs-3xl: 30px;

  /* ---- Radius ---- */
  --r-xs: 5px;
  --r-sm: 7px;
  --r-md: 10px;
  --r-lg: 14px;
  --r-xl: 18px;
  --r-full: 999px;

  /* ---- Shadow ---- */
  --shadow-sm: 0 1px 2px rgba(0,0,0,0.24);
  --shadow-md: 0 8px 24px -8px rgba(0,0,0,0.5);
  --shadow-lg: 0 24px 64px -16px rgba(0,0,0,0.6);
  --shadow-glow: 0 0 0 1px rgba(124,111,255,0.25), 0 8px 32px -8px rgba(124,111,255,0.28);

  /* ---- Blur ---- */
  --blur: 20px;

  /* ---- Motion ---- */
  --ease-out:    cubic-bezier(.16,1,.3,1);
  --ease-in-out: cubic-bezier(.65,0,.35,1);
  --dur-fast: 120ms;
  --dur-base: 200ms;
  --dur-slow: 360ms;

  /* ---- Layout ---- */
  --sidebar-w: 244px;
  --sidebar-w-collapsed: 72px;
  --topbar-h: 56px;
  --content-max: 1520px;
}

@media (prefers-reduced-motion: reduce){
  *{ animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; transition-duration: 0.001ms !important; scroll-behavior: auto !important; }
}


/* ==== css/base.css ==== */
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;550;600;650;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

*,*::before,*::after{ box-sizing:border-box; margin:0; padding:0; }
html{ color-scheme: dark; -webkit-text-size-adjust:100%; }
body{
  background:var(--bg);
  color:var(--text-primary);
  font-family:var(--font-ui);
  font-size:var(--fs-base);
  line-height:1.5;
  font-weight:450;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
}
body::before{
  content:'';
  position:fixed; inset:0; pointer-events:none; z-index:0;
  background:
    radial-gradient(1200px 600px at 14% -8%, rgba(124,111,255,0.08), transparent 60%),
    radial-gradient(900px 500px at 100% 0%, rgba(45,212,191,0.05), transparent 55%);
}
img{ display:block; max-width:100%; }
svg{ display:block; width:16px; height:16px; flex-shrink:0; }
a{ color:inherit; text-decoration:none; }
button,input,select,textarea{ font:inherit; color:inherit; }
button{ background:none; border:none; cursor:pointer; }
ul,ol{ list-style:none; }
table{ border-collapse:collapse; width:100%; }

h1,h2,h3,h4{ font-weight:650; letter-spacing:-0.015em; line-height:1.2; }

::selection{ background:var(--accent); color:#fff; }

/* Scrollbars */
*{ scrollbar-width:thin; scrollbar-color: rgba(255,255,255,0.14) transparent; }
*::-webkit-scrollbar{ width:9px; height:9px; }
*::-webkit-scrollbar-track{ background:transparent; }
*::-webkit-scrollbar-thumb{ background:rgba(255,255,255,0.12); border-radius:99px; border:2px solid transparent; background-clip:padding-box; }
*::-webkit-scrollbar-thumb:hover{ background:rgba(255,255,255,0.2); background-clip:padding-box; }

/* Focus */
:focus{ outline:none; }
:focus-visible{
  outline: 2px solid var(--accent);
  outline-offset: 2px;
  border-radius: 4px;
}

.mono{ font-family:var(--font-mono); font-variant-numeric:tabular-nums; }
.sr-only{
  position:absolute; width:1px; height:1px; padding:0; margin:-1px;
  overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0;
}

/* Skeleton */
.skel{
  background:linear-gradient(100deg, rgba(255,255,255,0.045) 30%, rgba(255,255,255,0.09) 45%, rgba(255,255,255,0.045) 60%);
  background-size:200% 100%;
  animation:skel-shine 1.5s ease-in-out infinite;
  border-radius:var(--r-sm);
}
@keyframes skel-shine{ 0%{background-position:150% 0;} 100%{background-position:-50% 0;} }

/* Fade/slide utility */
.enter{ animation: enterUp var(--dur-slow) var(--ease-out) both; }
@keyframes enterUp{ from{ opacity:0; transform:translateY(6px);} to{ opacity:1; transform:translateY(0);} }


/* ==== css/layout.css ==== */
.app-shell{ display:flex; min-height:100vh; position:relative; z-index:1; }

/* ---------------- Sidebar ---------------- */
.sidebar{
  width:var(--sidebar-w);
  flex-shrink:0;
  background:var(--bg-raised);
  border-right:1px solid var(--border-soft);
  display:flex; flex-direction:column;
  position:fixed; top:0; bottom:0; left:0; z-index:40;
  transition: width var(--dur-base) var(--ease-out), transform var(--dur-base) var(--ease-out);
}
.sidebar.collapsed{ width:var(--sidebar-w-collapsed); }

.sidebar-brand{
  height:var(--topbar-h); display:flex; align-items:center; gap:10px;
  padding:0 18px; border-bottom:1px solid var(--border-soft); flex-shrink:0;
}
.sidebar-brand .mark{
  width:26px; height:26px; border-radius:7px; flex-shrink:0;
  background:linear-gradient(150deg,var(--accent),var(--accent-2));
  display:flex; align-items:center; justify-content:center;
  font-size:12px; font-weight:700; color:#06070C;
}
.sidebar-brand .name{ font-weight:650; font-size:14.5px; letter-spacing:-0.01em; white-space:nowrap; overflow:hidden; }
.sidebar-brand .name small{ display:block; font-size:9.5px; font-weight:500; color:var(--text-tertiary); letter-spacing:0.06em; text-transform:uppercase; margin-top:1px; }
.sidebar.collapsed .name{ display:none; }

.sidebar-scroll{ flex:1; overflow-y:auto; padding:10px 10px 16px; }
.nav-group{ margin-bottom:4px; }
.nav-group-label{
  font-size:10px; font-weight:650; letter-spacing:0.08em; text-transform:uppercase;
  color:var(--text-tertiary); padding:14px 10px 6px;
}
.sidebar.collapsed .nav-group-label{ display:none; }

.nav-item{
  display:flex; align-items:center; gap:10px;
  padding:8px 10px; border-radius:var(--r-sm);
  font-size:var(--fs-md); font-weight:500; color:var(--text-secondary);
  transition: background var(--dur-fast) var(--ease-out), color var(--dur-fast) var(--ease-out);
  position:relative; white-space:nowrap; overflow:hidden;
}
.nav-item svg{ width:16px; height:16px; flex-shrink:0; opacity:0.85; }
.nav-item:hover{ background:var(--surface); color:var(--text-primary); }
.nav-item.active{ background:var(--accent-soft); color:#fff; }
.nav-item.active svg{ color:var(--accent); opacity:1; }
.nav-item.active::before{
  content:''; position:absolute; left:-10px; top:50%; transform:translateY(-50%);
  width:3px; height:16px; border-radius:2px; background:var(--accent);
}
.sidebar.collapsed .nav-item span{ display:none; }

.sidebar-foot{
  border-top:1px solid var(--border-soft); padding:10px; flex-shrink:0;
}
.status-pill{
  display:flex; align-items:center; gap:8px; padding:8px 10px; border-radius:var(--r-sm);
  font-size:var(--fs-xs); color:var(--text-secondary); cursor:pointer;
  transition:background var(--dur-fast);
}
.status-pill:hover{ background:var(--surface); }
.status-dot{ width:7px; height:7px; border-radius:50%; background:var(--success); box-shadow:0 0 0 3px var(--success-soft); flex-shrink:0; }
.status-dot.warn{ background:var(--warning); box-shadow:0 0 0 3px var(--warning-soft); }
.status-dot.err{ background:var(--error); box-shadow:0 0 0 3px var(--error-soft); }
.sidebar.collapsed .status-pill span{ display:none; }

.sidebar-collapse-btn{
  position:absolute; top:18px; right:-11px; width:22px; height:22px; border-radius:50%;
  background:var(--bg-raised); border:1px solid var(--border); display:flex; align-items:center; justify-content:center;
  color:var(--text-secondary); transition:all var(--dur-fast); z-index:5;
}
.sidebar-collapse-btn:hover{ color:var(--text-primary); border-color:var(--border-strong); }
.sidebar-collapse-btn svg{ width:12px; height:12px; transition:transform var(--dur-base); }
.sidebar.collapsed .sidebar-collapse-btn svg{ transform:rotate(180deg); }

/* ---------------- Main ---------------- */
.main{
  flex:1; margin-left:var(--sidebar-w);
  display:flex; flex-direction:column; min-width:0;
  transition:margin-left var(--dur-base) var(--ease-out);
}
.main.collapsed{ margin-left:var(--sidebar-w-collapsed); }

.topbar{
  height:var(--topbar-h); flex-shrink:0; position:sticky; top:0; z-index:30;
  background:rgba(6,7,12,0.78); backdrop-filter:blur(var(--blur)); -webkit-backdrop-filter:blur(var(--blur));
  border-bottom:1px solid var(--border-soft);
  display:flex; align-items:center; justify-content:space-between;
  padding:0 22px; gap:16px;
}
.breadcrumbs{ display:flex; align-items:center; gap:6px; font-size:var(--fs-sm); color:var(--text-tertiary); min-width:0; }
.breadcrumbs .crumb-current{ color:var(--text-primary); font-weight:550; }
.breadcrumbs svg{ width:12px; height:12px; opacity:0.5; flex-shrink:0; }
.breadcrumbs span{ white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

.topbar-right{ display:flex; align-items:center; gap:10px; flex-shrink:0; }

.search-trigger{
  display:flex; align-items:center; gap:8px; padding:7px 10px 7px 12px;
  background:var(--surface); border:1px solid var(--border); border-radius:var(--r-sm);
  color:var(--text-tertiary); font-size:var(--fs-sm); transition:all var(--dur-fast); width:230px;
}
.search-trigger:hover{ background:var(--surface-hover); border-color:var(--border-strong); }
.search-trigger svg{ width:14px; height:14px; flex-shrink:0; }
.search-trigger span{ flex:1; text-align:left; }
.kbd{
  font-family:var(--font-mono); font-size:10px; padding:2px 5px; border-radius:4px;
  background:rgba(255,255,255,0.06); border:1px solid var(--border); color:var(--text-tertiary);
}

.icon-btn{
  width:32px; height:32px; border-radius:var(--r-sm); display:flex; align-items:center; justify-content:center;
  color:var(--text-secondary); position:relative; transition:all var(--dur-fast);
}
.icon-btn:hover{ background:var(--surface); color:var(--text-primary); }
.icon-btn svg{ width:16px; height:16px; }
.icon-btn .dot{ position:absolute; top:6px; right:6px; width:6px; height:6px; border-radius:50%; background:var(--error); box-shadow:0 0 0 2px var(--bg-raised); }

.user-chip{ display:flex; align-items:center; gap:8px; padding:5px 9px 5px 5px; border-radius:var(--r-full); transition:background var(--dur-fast); }
.user-chip:hover{ background:var(--surface); }
.avatar{
  width:26px; height:26px; border-radius:50%; background:linear-gradient(150deg,var(--accent-2),var(--accent));
  display:flex; align-items:center; justify-content:center; font-size:10.5px; font-weight:650; color:#06070C; flex-shrink:0;
}
.user-chip .who{ font-size:var(--fs-xs); line-height:1.25; }
.user-chip .who b{ display:block; font-weight:600; color:var(--text-primary); font-size:11.5px; }
.user-chip .who small{ color:var(--text-tertiary); }

/* ---------------- Content ---------------- */
.content{ flex:1; padding:26px 28px 60px; max-width:var(--content-max); width:100%; }

.page-header{
  display:flex; align-items:flex-start; justify-content:space-between; gap:20px;
  margin-bottom:22px; flex-wrap:wrap;
}
.page-header h1{ font-size:var(--fs-2xl); margin-bottom:4px; }
.page-header .sub{ color:var(--text-secondary); font-size:var(--fs-sm); max-width:640px; }
.page-header-actions{ display:flex; gap:8px; flex-wrap:wrap; }

/* Responsive */
html, body{ overflow-x:hidden; }

/* Responsive card grids — every dashboard sets a fixed column count inline
   (repeat(4,1fr) etc.) for desktop; these breakpoints force sane wrapping
   on tablet/phone regardless of that inline value. */
@media (max-width: 900px){
  .card-grid{ grid-template-columns: repeat(2, 1fr) !important; }
}
@media (max-width: 560px){
  .card-grid{ grid-template-columns: 1fr !important; }
  .kpi-value{ font-size: 20px !important; }
}

/* Larger touch targets on touch-capable / narrow viewports */
@media (max-width: 1024px){
  .nav-item{ padding:11px 10px; }
  .icon-btn{ width:38px; height:38px; }
  .btn{ min-height:38px; }
  .tab{ padding:12px 4px; }
  th, td{ min-height:40px; }
}

@media (max-width: 1024px){

  .sidebar{ transform:translateX(-100%); box-shadow:var(--shadow-lg); }
  .sidebar.mobile-open{ transform:translateX(0); }
  .main, .main.collapsed{ margin-left:0; }
  .search-trigger{ width:auto; }
  .search-trigger span, .search-trigger .kbd{ display:none; }
  .sidebar-collapse-btn{ display:none; }
}
@media (max-width: 640px){
  .content{ padding:16px 12px 44px; }
  .topbar{ padding:0 12px; }
  .breadcrumbs{ display:none; }
  .user-chip .who{ display:none; }
  .user-chip{ padding:5px; }
  .page-header h1{ font-size:20px; }
  .page-header-actions{ width:100%; }
  .page-header-actions .btn{ flex:1; }
  .table-toolbar{ padding:12px; }
  .table-footer{ padding:10px 12px; }
  .panel-body{ padding:14px; }
  .drawer, .modal{ width:100vw !important; max-width:100vw; }
}
.mobile-nav-toggle{ display:none; }
@media (max-width:1024px){ .mobile-nav-toggle{ display:flex; } }

.scrim{
  position:fixed; inset:0; background:rgba(0,0,0,0.5); z-index:35; opacity:0; pointer-events:none;
  transition:opacity var(--dur-base);
}
.scrim.show{ opacity:1; pointer-events:auto; }


/* ==== css/components.css ==== */
/* ---------------- Buttons ---------------- */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:7px;
  height:34px; padding:0 14px; border-radius:var(--r-sm); font-size:var(--fs-sm); font-weight:550;
  border:1px solid transparent; transition:all var(--dur-fast) var(--ease-out); white-space:nowrap;
}
.btn svg{ width:14px; height:14px; }
.btn-primary{ background:var(--accent); color:#fff; box-shadow:0 1px 0 rgba(255,255,255,0.12) inset, 0 4px 14px -4px rgba(124,111,255,0.5); }
.btn-primary:hover{ background:#8B7FFF; transform:translateY(-1px); box-shadow:0 1px 0 rgba(255,255,255,0.15) inset, 0 8px 18px -4px rgba(124,111,255,0.55); }
.btn-primary:active{ transform:translateY(0); }
.btn-secondary{ background:var(--surface); border-color:var(--border); color:var(--text-primary); }
.btn-secondary:hover{ background:var(--surface-hover); border-color:var(--border-strong); }
.btn-ghost{ color:var(--text-secondary); }
.btn-ghost:hover{ background:var(--surface); color:var(--text-primary); }
.btn-danger{ background:var(--error-soft); color:#FCA5A5; border-color:rgba(248,113,113,0.25); }
.btn-danger:hover{ background:rgba(248,113,113,0.22); }
.btn-sm{ height:28px; padding:0 10px; font-size:var(--fs-xs); border-radius:6px; }
.btn:disabled{ opacity:0.4; pointer-events:none; }
.btn-icon{ width:34px; padding:0; }

/* ---------------- Card / Panel ---------------- */
.panel{
  background:var(--surface); border:1px solid var(--border); border-radius:var(--r-lg);
  transition:border-color var(--dur-fast);
}
.panel-glass{
  background:rgba(255,255,255,0.04);
  backdrop-filter:blur(var(--blur)); -webkit-backdrop-filter:blur(var(--blur));
  border:1px solid var(--border);
}
.panel-head{ display:flex; align-items:center; justify-content:space-between; padding:16px 18px; border-bottom:1px solid var(--border-soft); gap:12px; }
.panel-head h3{ font-size:var(--fs-base); font-weight:600; }
.panel-head .desc{ font-size:var(--fs-xs); color:var(--text-tertiary); margin-top:2px; }
.panel-body{ padding:18px; }
.panel-body.no-pad{ padding:0; }

.card-grid{ display:grid; gap:14px; }
.kpi-card{
  background:var(--surface); border:1px solid var(--border); border-radius:var(--r-lg); padding:16px 18px;
  transition:border-color var(--dur-fast), transform var(--dur-fast) var(--ease-out);
}
.kpi-card:hover{ border-color:var(--border-strong); }
.kpi-top{ display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
.kpi-label{ font-size:var(--fs-xs); color:var(--text-tertiary); font-weight:550; text-transform:uppercase; letter-spacing:0.04em; }
.kpi-icon{ width:28px; height:28px; border-radius:8px; display:flex; align-items:center; justify-content:center; }
.kpi-icon svg{ width:14px; height:14px; }
.kpi-value{ font-size:var(--fs-2xl); font-weight:650; letter-spacing:-0.02em; font-family:var(--font-mono); }
.kpi-foot{ display:flex; align-items:center; gap:6px; margin-top:8px; font-size:var(--fs-xs); color:var(--text-tertiary); }
.kpi-delta{ display:inline-flex; align-items:center; gap:3px; font-weight:600; }
.kpi-delta.up{ color:var(--success); }
.kpi-delta.down{ color:var(--error); }
.kpi-delta svg{ width:10px; height:10px; }

/* ---------------- Badges ---------------- */
.badge{
  display:inline-flex; align-items:center; gap:5px; padding:3px 9px; border-radius:var(--r-full);
  font-size:10.5px; font-weight:600; letter-spacing:0.02em; text-transform:uppercase; white-space:nowrap;
}
.badge::before{ content:''; width:5px; height:5px; border-radius:50%; background:currentColor; flex-shrink:0; }
.badge-success{ background:var(--success-soft); color:var(--success); }
.badge-warning{ background:var(--warning-soft); color:var(--warning); }
.badge-error{ background:var(--error-soft); color:var(--error); }
.badge-info{ background:var(--info-soft); color:var(--info); }
.badge-neutral{ background:rgba(255,255,255,0.08); color:var(--text-secondary); }
.badge-accent{ background:var(--accent-soft); color:#B4ABFF; }

/* ---------------- Tabs ---------------- */
.tabs{ display:flex; gap:2px; border-bottom:1px solid var(--border-soft); overflow-x:auto; }
.tab{
  padding:10px 4px; margin-right:20px; font-size:var(--fs-sm); font-weight:550; color:var(--text-tertiary);
  border-bottom:2px solid transparent; white-space:nowrap; transition:color var(--dur-fast);
}
.tab:hover{ color:var(--text-secondary); }
.tab.active{ color:var(--text-primary); border-color:var(--accent); }

.pillbar{ display:flex; gap:6px; padding:3px; background:var(--surface); border:1px solid var(--border); border-radius:var(--r-sm); width:fit-content; }
.pillbar .pill{ padding:5px 12px; font-size:var(--fs-xs); font-weight:550; color:var(--text-tertiary); border-radius:6px; transition:all var(--dur-fast); }
.pillbar .pill.active{ background:var(--surface-strong); color:var(--text-primary); }

/* ---------------- Table ---------------- */
.table-wrap{ overflow-x:auto; border-radius:var(--r-lg); }
.dtable{ font-size:var(--fs-sm); }
.dtable thead th{
  position:sticky; top:0; z-index:2; background:var(--bg-raised);
  text-align:left; padding:10px 14px; font-size:10.5px; font-weight:650; text-transform:uppercase;
  letter-spacing:0.05em; color:var(--text-tertiary); border-bottom:1px solid var(--border); white-space:nowrap;
}
.dtable thead th.sortable{ cursor:pointer; user-select:none; }
.dtable thead th.sortable:hover{ color:var(--text-secondary); }
.dtable thead th .sort-ic{ display:inline-block; width:9px; margin-left:3px; opacity:0.5; }
.dtable tbody tr{ border-bottom:1px solid var(--border-soft); transition:background var(--dur-fast); }
.dtable tbody tr:hover{ background:rgba(255,255,255,0.025); }
.dtable tbody tr.selected{ background:var(--accent-soft); }
.dtable td{ padding:11px 14px; color:var(--text-primary); vertical-align:middle; }
.dtable.compact td, .dtable.compact th{ padding:6px 12px; }
.dtable .cell-sub{ color:var(--text-tertiary); font-size:var(--fs-xs); margin-top:1px; }

<div class="app-shell">

<script type="module">
// ==== js/biometric/device-config.js ====
/**
 * Biometric — Device Configuration
 * ------------------------------------------------------------------
 * LabourPro's frontend never talks to biometric hardware directly.
 * Browsers cannot universally speak proprietary terminal protocols
 * (TCP/4370 push protocols, vendor SDKs, ISAPI, WebSocket agents,
 * etc.), so all device I/O is delegated to a configurable backend
 * "device gateway" service. This file is the single place that
 * config lives, so pointing LabourPro at a real gateway is a one-line
 * change — nothing in the UI or biometric layer needs to change.
 *
 * When you connect your actual machine, implement the gateway's
 * REST/WebSocket surface to match device-api.js's expectations, using
 * whatever protocol/SDK your hardware vendor ships (e.g. ZKTeco
 * PUSH/SDK, Suprema BioStar API, ESSL, Hikvision ISAPI, etc.) — this
 * layer intentionally does not assume which one.
 * ------------------------------------------------------------------
 */
const deviceConfig = {
  // Base URL of your device gateway. Not configured out of the box.
  gatewayBaseUrl: null, // e.g. 'https://gateway.internal.yourco.com/api'

  // Auth token/header for the gateway, injected by your deployment.
  gatewayAuthHeader: null,

  // Timeouts (ms)
  connectTimeoutMs: 8000,
  requestTimeoutMs: 12000,

  // Poll interval for health checks when no push/webhook channel exists.
  healthPollMs: 15000,

  // Live event channel. LIVE mode expects the gateway to push events
  // (WebSocket/SSE) to this path; DEVELOPMENT mode never touches it.
  liveEventSocketPath: '/attendance/stream',

  isGatewayConfigured(){
    return Boolean(this.gatewayBaseUrl);
  },
};


// ==== js/biometric/device-api.js ====
/**
 * Biometric — Device API Adapter
 * ------------------------------------------------------------------
 * This is the ONLY module that should ever be called for hardware
 * I/O. Every function returns a Promise and mirrors what a real
 * device gateway would expose. In LIVE DEVICE MODE (deviceConfig
 * .isGatewayConfigured() === true) calls are forwarded to the
 * configured gateway over HTTP. In DEVELOPMENT MODE (no gateway
 * configured) calls resolve with clearly-tagged simulated data so the
 * rest of the application can be built and tested honestly — nothing
 * here is ever presented as a real hardware event.
 * ------------------------------------------------------------------
 */

async function gatewayRequest(path, options={}){
  if(!deviceConfig.isGatewayConfigured()){
    throw new Error('DEVICE_GATEWAY_NOT_CONFIGURED');
  }
  const res = await fetch(`${deviceConfig.gatewayBaseUrl}${path}`, {
    ...options,
    headers: {
      'Content-Type':'application/json',
      ...(deviceConfig.gatewayAuthHeader ? { Authorization: deviceConfig.gatewayAuthHeader } : {}),
      ...(options.headers||{}),
    },
  });
  if(!res.ok) throw new Error(`GATEWAY_ERROR_${res.status}`);
  return res.json();
}

function simulate(payload, delay=500){
  return new Promise(resolve=> setTimeout(()=> resolve({ ...payload, _simulated:true }), delay));
}

const deviceApi = {
  mode(){ return deviceConfig.isGatewayConfigured() ? 'LIVE':'DEVELOPMENT'; },

  async connectDevice(device){
    if(deviceConfig.isGatewayConfigured()){
      return gatewayRequest(`/devices/${device.id}/connect`, { method:'POST' });
    }
    return simulate({ deviceId:device.id, status:'CONNECTED' }, 900);
  },

  async disconnectDevice(device){
    if(deviceConfig.isGatewayConfigured()){
      return gatewayRequest(`/devices/${device.id}/disconnect`, { method:'POST' });
    }
    return simulate({ deviceId:device.id, status:'DISCONNECTED' }, 400);
  },

  async getDeviceStatus(device){
    if(deviceConfig.isGatewayConfigured()){
      return gatewayRequest(`/devices/${device.id}/status`);
    }
    return simulate({ deviceId:device.id, status:device.connectionStatus, deviceTime:new Date().toISOString() });
  },

  async getDeviceInfo(device){
    if(deviceConfig.isGatewayConfigured()){
      return gatewayRequest(`/devices/${device.id}/info`);
    }
    return simulate({ deviceId:device.id, firmware:device.firmware, model:device.model, serial:device.serial });
  },

  async syncUsers(device){
    if(deviceConfig.isGatewayConfigured()){
      return gatewayRequest(`/devices/${device.id}/users/sync`, { method:'POST' });
    }
    return simulate({ deviceId:device.id, usersSynced:device.registeredUsers }, 1200);
  },

  async pushUser(device, staff){
    if(deviceConfig.isGatewayConfigured()){
      return gatewayRequest(`/devices/${device.id}/users`, { method:'POST', body:JSON.stringify({ staffId: staff.id, biometricId: staff.biometricId }) });
    }
    return simulate({ deviceId:device.id, staffId:staff.id, enrolled:true }, 1000);
  },

  async removeUser(device, staff){
    if(deviceConfig.isGatewayConfigured()){
      return gatewayRequest(`/devices/${device.id}/users/${staff.biometricId}`, { method:'DELETE' });
    }
    return simulate({ deviceId:device.id, staffId:staff.id, removed:true }, 500);
  },

  async getAttendanceLogs(device, since){
    if(deviceConfig.isGatewayConfigured()){
      return gatewayRequest(`/devices/${device.id}/attendance-logs?since=${encodeURIComponent(since||'')}`);
    }
    return simulate({ deviceId:device.id, logs:[] });
  },

  async syncAttendance(device){
    if(deviceConfig.isGatewayConfigured()){
      return gatewayRequest(`/devices/${device.id}/attendance/sync`, { method:'POST' });
    }
    return simulate({ deviceId:device.id, synced:0 }, 900);
  },
};


// ==== js/biometric/device-manager.js ====
/**
 * Biometric — Device Manager
 * ------------------------------------------------------------------
 * Orchestrates device connection lifecycle and exposes a small
 * pub/sub surface so UI screens (Biometric Devices, Live Terminal,
 * Enrollment) can subscribe to state changes instead of polling.
 * Wraps device-api.js; never touches hardware directly.
 * ------------------------------------------------------------------
 */

const listeners = new Map(); // event -> Set<fn>

function emit(event, payload){
  (listeners.get(event) || new Set()).forEach(fn=> fn(payload));
}

const deviceManager = {
  on(event, fn){
    if(!listeners.has(event)) listeners.set(event, new Set());
    listeners.get(event).add(fn);
    return ()=> listeners.get(event).delete(fn);
  },

  async connect(device){
    emit('device:state', { deviceId:device.id, state:'AUTHENTICATING' });
    try{
      await deviceApi.connectDevice(device);
      emit('device:state', { deviceId:device.id, state:'CONNECTED' });
      return true;
    }catch(err){
      emit('device:state', { deviceId:device.id, state:'ERROR', error: err.message });
      return false;
    }
  },

  async disconnect(device){
    await deviceApi.disconnectDevice(device);
    emit('device:state', { deviceId:device.id, state:'DISCONNECTED' });
  },

  async syncUsers(device){
    emit('device:state', { deviceId:device.id, state:'SYNCING' });
    const res = await deviceApi.syncUsers(device);
    emit('device:state', { deviceId:device.id, state:'CONNECTED' });
    return res;
  },

  /** Emits a fully-labeled simulated biometric event stream for DEVELOPMENT MODE only. */
  startSimulationStream(device, onEvent){
    const stages = ['AUTH_RECEIVED','IDENTITY_VERIFICATION','EMPLOYEE_IDENTIFIED','WAREHOUSE_VALIDATED','ATTENDANCE_LOGGED','DB_SYNCED'];
    let cancelled = false;
    const runOnce = async ()=>{
      for(const stage of stages){
        if(cancelled) return;
        await new Promise(r=> setTimeout(r, 380 + Math.random()*260));
        onEvent({ stage, deviceId:device.id, simulated:true, timestamp:new Date().toISOString() });
      }
    };
    const interval = setInterval(()=>{ if(!cancelled) runOnce(); }, 4200);
    runOnce();
    return ()=>{ cancelled = true; clearInterval(interval); };
  },
};


// ==== js/biometric/attendance-sync.js ====
/**
 * Biometric — Attendance Sync
 * ------------------------------------------------------------------
 * Bridges raw device attendance logs into LabourPro's attendance
 * processing pipeline (AttendanceEvent model). Runs the same
 * validation states described in the attendance engine spec:
 * RECEIVED -> VALIDATED -> PROCESSED -> EXCEPTION / REJECTED.
 * ------------------------------------------------------------------
 */

const attendanceSync = {
  async pullFromDevice(device, staffDirectory, warehouseId){
    const { logs=[] } = await deviceApi.getAttendanceLogs(device);
    return logs.map(log=> this.validate(log, staffDirectory, device, warehouseId));
  },

  /** Validates a raw punch against known staff/device/warehouse mappings. */
  validate(log, staffDirectory, device, warehouseId){
    const staff = staffDirectory.find(s=> s.biometricId === log.biometricId);
    if(!staff) return { ...log, processingState:'REJECTED', reason:'UNKNOWN_BIOMETRIC_ID' };
    if(staff.warehouseId !== warehouseId) return { ...log, processingState:'EXCEPTION', reason:'WAREHOUSE_MISMATCH' };
    return { ...log, staffId: staff.id, deviceId: device.id, processingState:'VALIDATED' };
  },

  async syncDevice(device){
    return deviceApi.syncAttendance(device);
  },
};


// ==== js/biometric/device-health.js ====
/**
 * Biometric — Device Health
 * ------------------------------------------------------------------
 * Aggregates device connection health for the global system status
 * indicator and the Biometric Devices module. In LIVE mode this
 * would poll deviceApi.getDeviceStatus() per device on an interval
 * (see deviceConfig.healthPollMs) or subscribe to gateway push
 * events; in DEVELOPMENT mode it reflects the mock store state.
 * ------------------------------------------------------------------
 */

const deviceHealth = {
  summarize(devices){
    const total = devices.length;
    const connected = devices.filter(d=> d.connectionStatus === 'CONNECTED').length;
    const errored = devices.filter(d=> d.connectionStatus === 'ERROR').length;
    const offline = devices.filter(d=> d.connectionStatus === 'DISCONNECTED').length;
    const health = total===0 ? 'NOT_CONFIGURED' : errored>0 ? 'DEGRADED' : offline>0 ? 'PARTIAL' : 'HEALTHY';
    return { total, connected, errored, offline, health };
  },

  async pollOnce(device){
    try{
      const status = await deviceApi.getDeviceStatus(device);
      return { deviceId:device.id, ok:true, status };
    }catch(err){
      return { deviceId:device.id, ok:false, error: err.message };
    }
  },

  startPolling(devices, onTick){
    const timer = setInterval(async ()=>{
      const results = await Promise.all(devices.map(d=> this.pollOnce(d)));
      onTick(results);
    }, deviceConfig.healthPollMs);
    return ()=> clearInterval(timer);
  },
};


// ==== js/services/supabaseClient.js ====
/**
 * LabourPro — Supabase Client
 * ------------------------------------------------------------------

function uid(){ return Math.random().toString(36).slice(2,8).toUpperCase(); }
function pick(arr,n){ const c=[...arr]; const out=[]; for(let i=0;i<n && c.length;i++){ out.push(c.splice(Math.floor(Math.random()*c.length),1)[0]); } return out; }
function pickOne(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
function weighted(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
function daysAgo(n){ const d=new Date(); d.setDate(d.getDate()-n); return d.toISOString(); }
function dateStr(n){ const d=new Date(); d.setDate(d.getDate()-n); return d.toISOString().slice(0,10); }

async function clearDatabase(){
  const tables = [
    'audit_logs','compliance_documents','invoices','billable_schedules','purchase_orders',
    'cost_accruals','overtime','adhoc_requests','transfers','attendance_exceptions',
    'attendance_events','biometric_devices','labour_structure','staff','vendors','warehouses',
  ];
  for(const t of tables){
    const { error } = await supabase.from(t).delete().not('id','is', null);
    if(error) console.error('[Supabase] clear', t, error.message);
  }
  _hasDataCache = false;
}

function ensureStack(){
  let stack = document.querySelector('.toast-stack');
  if(!stack){
    stack = document.createElement('div');
    stack.className = 'toast-stack';
    document.body.appendChild(stack);
  }
  return stack;
}

const iconFor = { success:'checkCircle', error:'xCircle', warning:'alertCircle', info:'info' };

const toast = {
  show({ type='info', title, msg, duration=4200 }){
    const stack = ensureStack();
    const el = document.createElement('div');
    el.className = 'toast';
    el.innerHTML = `
      <span class="ic ${type}">${icon(iconFor[type]||'info')}</span>
      <div>
        ${title ? `<div class="title">${title}</div>`:''}
        ${msg ? `<div class="msg">${msg}</div>`:''}
      </div>`;
    stack.appendChild(el);
    setTimeout(()=>{
      el.style.transition = 'all 220ms ease';
      el.style.opacity = '0';
      el.style.transform = 'translateX(16px)';
      setTimeout(()=> el.remove(), 220);
    }, duration);
  },
};


// ==== js/components/table.js ====

/**
 * createDataTable(el, options)
 * options: {
 *   columns: [{ key, label, sortable, render(row), width }],
 *   rows: [...],
 *   getId: row => string,
 *   pageSize: number,
 *   searchKeys: [string],
 *   filters: [{ key, label, options:[{value,label}] }],
 *   bulkActions: [{ label, onClick(selectedRows) }],
 *   onRowClick: row => void,
 *   emptyState: { icon, title, desc },
 * }
 */
function createDataTable(el, options){
  const state = {
    page: 1, pageSize: options.pageSize || 10, sortKey: null, sortDir: 1,
    query: '', density: 'comfortable', activeFilters: {}, selected: new Set(), visibleCols: new Set(options.columns.map(c=>c.key)),
  };

  function filteredRows(){
    let rows = options.rows;
    if(state.query){
      const q = state.query.toLowerCase();
      const keys = options.searchKeys || options.columns.map(c=>c.key);
      rows = rows.filter(r=> keys.some(k=> String(r[k]??'').toLowerCase().includes(q)));
    }
    Object.entries(state.activeFilters).forEach(([k,v])=>{
      if(v) rows = rows.filter(r=> String(r[k]) === v);
    });
    if(state.sortKey){
      rows = [...rows].sort((a,b)=>{
        const av=a[state.sortKey], bv=b[state.sortKey];
        if(typeof av==='number') return (av-bv)*state.sortDir;
        return String(av).localeCompare(String(bv))*state.sortDir;
      });
    }
    return rows;
  }

  function paginate(rows){
    const total = rows.length;
    const pages = Math.max(1, Math.ceil(total/state.pageSize));
    state.page = Math.min(state.page, pages);
    const start = (state.page-1)*state.pageSize;
    return { rows: rows.slice(start, start+state.pageSize), total, pages };
  }

  function render(){
    const all = filteredRows();
    const { rows, total, pages } = paginate(all);
    const cols = options.columns.filter(c=> state.visibleCols.has(c.key));

    if(options.rows.length===0){
      el.innerHTML = emptyStateHtml(options.emptyState);
      return;
    }

    el.innerHTML = `
      <div class="table-toolbar">
        <div class="table-toolbar-left">
          <div class="search-input-wrap">${icon('search')}<input class="input" style="width:220px" id="tblSearch" placeholder="Search…" value="${state.query}"/></div>
          ${(options.filters||[]).map(f=> `
            <select class="select" style="width:auto;height:34px;" data-filter="${f.key}">
              <option value="">${f.label}: All</option>
              ${f.options.map(o=> `<option value="${o.value}" ${state.activeFilters[f.key]===o.value?'selected':''}>${o.label}</option>`).join('')}
            </select>`).join('')}
        </div>
        <div class="table-toolbar-right">
          ${state.selected.size ? bulkActionsHtml(state.selected.size) : ''}
          <div class="pillbar">
            <button class="pill ${state.density==='comfortable'?'active':''}" data-density="comfortable">Comfortable</button>
            <button class="pill ${state.density==='compact'?'active':''}" data-density="compact">Compact</button>
          </div>
          <button class="btn btn-secondary btn-sm" id="tblExport">${icon('download')}Export</button>
        </div>
      </div>
      <div class="table-wrap">
        <table class="dtable ${state.density==='compact'?'compact':''}">
          <thead><tr>
            ${options.selectable ? `<th style="width:34px;"><input type="checkbox" class="checkbox" id="selectAll"/></th>`:''}
            ${cols.map(c=> `<th class="${c.sortable?'sortable':''}" data-key="${c.key}" style="${c.width?`width:${c.width}`:''}">${c.label}${c.sortable?`<span class="sort-ic">${state.sortKey===c.key?(state.sortDir===1?'↑':'↓'):'↕'}</span>`:''}</th>`).join('')}
          </tr></thead>
          <tbody>
            ${rows.map(r=>{
              const id = options.getId(r);
              return `<tr data-id="${id}" class="${state.selected.has(id)?'selected':''}" style="${options.onRowClick?'cursor:pointer':''}">
                ${options.selectable ? `<td><input type="checkbox" class="row-checkbox" data-id="${id}" ${state.selected.has(id)?'checked':''}/></td>`:''}
                ${cols.map(c=> `<td>${c.render ? c.render(r) : (r[c.key] ?? '—')}</td>`).join('')}
              </tr>`;
            }).join('')}
          </tbody>
        </table>
      </div>
      <div class="table-footer">
        <span>${total.toLocaleString()} record${total===1?'':'s'}${state.selected.size?` · ${state.selected.size} selected`:''}</span>
        <div class="pager">
          <button data-pg="first" ${state.page===1?'disabled':''}>${icon('chevronLeft')}${icon('chevronLeft')}</button>
          <button data-pg="prev" ${state.page===1?'disabled':''}>${icon('chevronLeft')}</button>
          <span style="padding:0 8px;">Page ${state.page} of ${pages}</span>
          <button data-pg="next" ${state.page===pages?'disabled':''}>${icon('chevronRight')}</button>
          <button data-pg="last" ${state.page===pages?'disabled':''}>${icon('chevronRight')}${icon('chevronRight')}</button>
        </div>
      </div>`;

    bind(all);
  }

  function bulkActionsHtml(n){
    return (options.bulkActions||[]).map(a=> `<button class="btn btn-secondary btn-sm" data-bulk="${a.label}">${a.label} (${n})</button>`).join('');
  }

  function bind(all){
    el.querySelector('#tblSearch')?.addEventListener('input', (e)=>{ state.query = e.target.value; state.page=1; render(); });
    el.querySelectorAll('[data-filter]').forEach(sel=> sel.addEventListener('change', (e)=>{ state.activeFilters[e.target.dataset.filter] = e.target.value; state.page=1; render(); }));
    el.querySelectorAll('[data-density]').forEach(btn=> btn.addEventListener('click', ()=>{ state.density = btn.dataset.density; render(); }));
    el.querySelectorAll('th.sortable').forEach(th=> th.addEventListener('click', ()=>{
      const k = th.dataset.key;
      state.sortDir = state.sortKey===k ? -state.sortDir : 1;
      state.sortKey = k; render();
    }));
    el.querySelectorAll('[data-pg]').forEach(btn=> btn.addEventListener('click', ()=>{
      const pages = Math.max(1, Math.ceil(filteredRows().length/state.pageSize));
      if(btn.dataset.pg==='first') state.page=1;
      if(btn.dataset.pg==='prev') state.page=Math.max(1,state.page-1);
      if(btn.dataset.pg==='next') state.page=Math.min(pages,state.page+1);
      if(btn.dataset.pg==='last') state.page=pages;
      render();
    }));
    el.querySelector('#tblExport')?.addEventListener('click', ()=> exportCsv(filteredRows(), options.columns));
    el.querySelector('#selectAll')?.addEventListener('change', (e)=>{
      const { rows } = paginate(filteredRows());
      rows.forEach(r=> e.target.checked ? state.selected.add(options.getId(r)) : state.selected.delete(options.getId(r)));
      render();
    });
    el.querySelectorAll('.row-checkbox').forEach(cb=> cb.addEventListener('click', (e)=>{
      e.stopPropagation();
      cb.checked ? state.selected.add(cb.dataset.id) : state.selected.delete(cb.dataset.id);
      render();
    }));
    el.querySelectorAll('[data-bulk]').forEach(btn=> btn.addEventListener('click', ()=>{
      const action = (options.bulkActions||[]).find(a=> a.label===btn.dataset.bulk);
      const rows = all.filter(r=> state.selected.has(options.getId(r)));
      action?.onClick(rows);
    }));
    if(options.onRowClick){
      el.querySelectorAll('tbody tr').forEach(tr=> tr.addEventListener('click', (e)=>{
        if(e.target.closest('input')) return;
        const row = options.rows.find(r=> options.getId(r)===tr.dataset.id);
        options.onRowClick(row);
      }));
    }
  }

  function exportCsv(rows, cols){
    const header = cols.map(c=>c.label).join(',');
    const lines = rows.map(r=> cols.map(c=> `"${String(r[c.key]??'').replace(/"/g,'""')}"`).join(','));
    const csv = [header, ...lines].join('\n');
    const blob = new Blob([csv], { type:'text/csv' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = 'export.csv'; a.click();
  }

  function emptyStateHtml(cfg){
    const c = cfg || { icon:'grid', title:'No records yet', desc:'Data will appear here once available.' };
    return `<div class="state-block"><div class="state-icon">${icon(c.icon)}</div><h3>${c.title}</h3><p>${c.desc}</p></div>`;
  }

  render();
  return { refresh: render, getSelected: ()=> Array.from(state.selected) };
}

let root = null;
let activeIndex = 0;
let flatItems = [];

function ensureRoot(){
  if(root) return root;
  root = document.createElement('div');
  root.className = 'modal-scrim';
  root.innerHTML = `
    <div class="modal cmdk">
      <div class="cmdk-input-row">
        ${icon('search')}
        <input class="cmdk-input" id="cmdkInput" placeholder="Search staff, vendors, warehouses, POs, invoices, approvals…" autocomplete="off" />
        <button class="icon-btn" id="cmdkClose">${icon('x')}</button>
      </div>
      <div class="cmdk-results" id="cmdkResults"></div>
      <div class="cmdk-foot">
        <span>${icon('chevronDown')}${icon('chevronRight')} Navigate</span>
        <span>${icon('check')} Select</span>
        <span>Esc Close</span>
      </div>
    </div>`;
  document.body.appendChild(root);
  root.addEventListener('click', (e)=>{ if(e.target===root) close(); });
  root.querySelector('#cmdkClose').addEventListener('click', close);
  root.querySelector('#cmdkInput').addEventListener('input', (e)=> runSearch(e.target.value));
  root.addEventListener('keydown', (e)=>{
    if(e.key==='Escape'){ close(); }
    if(e.key==='ArrowDown'){ e.preventDefault(); move(1); }
    if(e.key==='ArrowUp'){ e.preventDefault(); move(-1); }
    if(e.key==='Enter'){ e.preventDefault(); flatItems[activeIndex]?.action(); }
  });
  return root;
}

function move(dir){
  if(!flatItems.length) return;
  activeIndex = (activeIndex + dir + flatItems.length) % flatItems.length;
  render(flatItems, true);
}

async function runSearch(q){
  const results = document.getElementById('cmdkResults');
  if(!q || q.length < 1){
    results.innerHTML = `<div style="padding:32px 10px;text-align:center;color:var(--text-tertiary);font-size:var(--fs-sm);">Type to search across the workspace</div>`;
    flatItems = [];
    return;
  }
  const [staff, vendors, warehouses, approvals, invoices, pos] = await Promise.all([
    api.listStaff(), api.listVendors(), api.listWarehouses(), api.listApprovals(), api.listInvoices(), api.listPurchaseOrders(),
  ]);
  const ql = q.toLowerCase();
  const groups = [
    { label:'Staff', icon:'users', href:'#workforce-staff', matches: staff.filter(s=> s.name.toLowerCase().includes(ql)).slice(0,4).map(s=>({ title:s.name, meta:s.id, href:'#workforce-staff' })) },
    { label:'Vendors', icon:'truck', href:'#workforce-vendors', matches: vendors.filter(v=> v.name.toLowerCase().includes(ql)).slice(0,4).map(v=>({ title:v.name, meta:v.code, href:'#workforce-vendors' })) },
    { label:'Warehouses', icon:'building', href:'#admin-warehouses', matches: warehouses.filter(w=> w.name.toLowerCase().includes(ql) || w.code.toLowerCase().includes(ql)).slice(0,4).map(w=>({ title:w.name, meta:w.code, href:'#admin-warehouses' })) },
    { label:'Approvals', icon:'checkCircle', href:'#governance-approvals', matches: approvals.filter(a=> a.title.toLowerCase().includes(ql)).slice(0,4).map(a=>({ title:a.title, meta:a.priority, href:'#governance-approvals' })) },
    { label:'Purchase Orders', icon:'fileText', href:'#procurement-pos', matches: pos.filter(p=> p.id.toLowerCase().includes(ql)).slice(0,4).map(p=>({ title:p.id, meta:p.period, href:'#procurement-pos' })) },
    { label:'Invoices', icon:'receipt', href:'#procurement-invoices', matches: invoices.filter(i=> i.id.toLowerCase().includes(ql)).slice(0,4).map(i=>({ title:i.id, meta:i.matchStatus, href:'#procurement-invoices' })) },
  ].filter(g=> g.matches.length);

  flatItems = [];
  groups.forEach(g=> g.matches.forEach(m=> flatItems.push({ ...m, group:g.label, icon:g.icon, action:()=>{ location.href = m.href; } })));
  activeIndex = 0;
  render(groups.map(g=>({...g})), false);
}

function render(groups, isFlat){
  const results = document.getElementById('cmdkResults');
  if(!flatItems.length){
    results.innerHTML = `<div style="padding:32px 10px;text-align:center;color:var(--text-tertiary);font-size:var(--fs-sm);">No matches found</div>`;
    return;
  }
  let idx = 0;
  const bygroup = {};
  flatItems.forEach(item=>{ (bygroup[item.group] ||= []).push(item); });
  results.innerHTML = Object.entries(bygroup).map(([label, items])=>{
    return `<div class="cmdk-group-label">${label}</div>` + items.map(it=>{
      const i = idx++;
      const html = `<div class="cmdk-item ${i===activeIndex?'active':''}" data-idx="${i}">${icon(it.icon)}<span>${it.title}</span><span class="meta">${it.meta||''}</span></div>`;
      return html;
    }).join('');
  }).join('');
  results.querySelectorAll('.cmdk-item').forEach(el=>{
    el.addEventListener('click', ()=> flatItems[+el.dataset.idx]?.action());
    el.addEventListener('mouseenter', ()=>{ activeIndex = +el.dataset.idx; render(groups, true); });
  });
}

async function refreshStatus(){
  const dot = document.getElementById('statusDot');
  const text = document.getElementById('statusText');
  if(!dot) return;
  try{
    const status = await api.getSystemStatus();
    const values = Object.values(status);
    const degraded = values.includes('DEGRADED');
    const notConfigured = values.every(v=> v==='NOT_CONFIGURED') || status.biometricGateway==='NOT_CONFIGURED';
    dot.className = 'status-dot ' + (degraded ? 'warn' : '');
    text.textContent = degraded ? 'System degraded' : notConfigured ? 'Biometric gateway not configured' : 'All systems operational';
  }catch(e){
    dot.className = 'status-dot err';
    text.textContent = 'Status unavailable';
  }
}

function mountShell(){
  const meta = PAGE_META[currentRouteHash()];
  const shellRoot = document.getElementById('shell-root');
  if(!shellRoot) return;

  shellRoot.insertAdjacentHTML('afterbegin', `
    <div class="scrim" id="scrim"></div>
    ${buildSidebar(meta ? meta.key : 'overview')}
  `);
  const main = document.querySelector('.main');
  if(main) main.insertAdjacentHTML('afterbegin', buildTopbar(meta));

  // Collapse toggle
  const collapseBtn = document.getElementById('collapseBtn');
  const sidebar = document.getElementById('sidebar');
  collapseBtn?.addEventListener('click', ()=>{
    const nowCollapsed = !sidebar.classList.contains('collapsed');
    sidebar.classList.toggle('collapsed', nowCollapsed);
    main?.classList.toggle('collapsed', nowCollapsed);
    sessionStorage.setItem('lp_sidebar_collapsed', nowCollapsed ? '1':'0');
  });
  if(sessionStorage.getItem('lp_sidebar_collapsed')==='1'){ main?.classList.add('collapsed'); }

  // Mobile nav
  const scrim = document.getElementById('scrim');
  const openMobile = ()=>{ sidebar.classList.add('mobile-open'); scrim.classList.add('show'); };
  const closeMobile = ()=>{ sidebar.classList.remove('mobile-open'); scrim.classList.remove('show'); };
  document.getElementById('mobileNavToggle')?.addEventListener('click', openMobile);
  scrim?.addEventListener('click', closeMobile);

  // Search
  document.getElementById('searchTrigger')?.addEventListener('click', openCommandPalette);
  window.addEventListener('keydown', (e)=>{
    if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='k'){ e.preventDefault(); openCommandPalette(); }
  });

  document.getElementById('notifBtn')?.addEventListener('click', ()=>{
    toast.show({ type:'info', title:'Notifications', msg:'No notifications wired to a live channel yet in this build.' });
  });

  refreshStatus();
  setInterval(refreshStatus, 20000);
}

const ROUTES = {};
let _routeCleanup = null;

function updateShellForRoute(){
  const hash = currentRouteHash();
  const meta = PAGE_META[hash];
  document.querySelectorAll('.nav-item').forEach(el=>{
    el.classList.toggle('active', el.getAttribute('href') === hash);
  });
  const crumbs = document.querySelector('.breadcrumbs');
  if(crumbs){
    crumbs.innerHTML = meta ? `
      <span>LabourPro</span>${icon('chevronRight')}
      <span>${meta.group || 'Overview'}</span>${meta.group ? icon('chevronRight'):''}
      <span class="crumb-current">${meta.label}</span>
    ` : `<span class="crumb-current">Overview</span>`;
  }
  document.title = (meta ? meta.label : 'Overview') + ' · LabourPro';
}

async function renderRoute(){
  if(_routeCleanup){ try{ _routeCleanup(); }catch(e){} _routeCleanup = null; }
  const hash = currentRouteHash();
  const route = ROUTES[hash] || ROUTES['#index'];
  const container = document.getElementById('page-content');
  container.innerHTML = route.html;
  updateShellForRoute();
  const maybeCleanup = await route.init();
  if(typeof maybeCleanup === 'function') _routeCleanup = maybeCleanup;
  window.scrollTo(0,0);
  // On phone/tablet, close the slide-in nav drawer after navigating so it
  // doesn't stay covering the new page content.
  if(window.innerWidth <= 1024){
    document.getElementById('sidebar')?.classList.remove('mobile-open');
    document.getElementById('scrim')?.classList.remove('show');
  }
}

window.addEventListener('hashchange', renderRoute);

async function init_attendance_exceptions(){

let staff=[], warehouses=[], all=[], statusFilter='OPEN';

function renderTable(){

    const st = staff.find(s=>s.id===e.staffId);

document.querySelectorAll('#statusFilter .pill').forEach(p=> p.addEventListener('click', ()=>{
  document.querySelectorAll('#statusFilter .pill').forEach(x=>x.classList.remove('active')); p.classList.add('active');
  statusFilter = p.dataset.v; renderTable();
}));

function openResolve(e){
  if(e.status==='RESOLVED'){
    showModal(`
      <div class="panel-head"><h3>Exception resolved</h3><button class="icon-btn" id="closeModal">${icon('x')}</button></div>
      <div class="panel-body">
        <div class="card-grid" style="grid-template-columns:1fr 1fr;">
          ${field('Action', e.resolution.action)}${field('User', e.resolution.user)}
          ${field('Reason', e.resolution.reason)}${field('Timestamp', new Date(e.resolution.timestamp).toLocaleString())}
        </div>
      </div>`);
    return;
  }
  showModal(`
    <div class="panel-head"><h3>Resolve exception — ${typeLabel[e.type]}</h3><button class="icon-btn" id="closeModal">${icon('x')}</button></div>
    <div class="panel-body">
      <div class="field mb-16"><label>Action <span class="req">*</span></label>
        <select class="select" id="actionSel">
          <option>Approve as authorized manual entry</option>
          <option>Request re-punch from staff</option>
          <option>Escalate to facility manager</option>
          <option>Mark as vendor-side error</option>
        </select>
      </div>
      <div class="field mb-16"><label>Reason <span class="req">*</span></label><textarea class="input" id="reasonInput" placeholder="Explain the resolution for audit purposes…"></textarea></div>
      <div class="hint">This resolution will be recorded with your user ID and a timestamp in the audit trail.</div>
    </div>
    <div class="drawer-foot" style="border-top:1px solid var(--border-soft);">
      <button class="btn btn-secondary" id="cancelModal">Cancel</button>
      <button class="btn btn-primary" id="confirmResolve">Resolve exception</button>
    </div>`);
  document.getElementById('confirmResolve').addEventListener('click', async ()=>{
    const reason = document.getElementById('reasonInput').value.trim();
    if(!reason){ toast.show({type:'warning', title:'Reason required'}); return; }
    await api.resolveException(e.id, { action:document.getElementById('actionSel').value, reason, user:'facility.manager@labourpro', timestamp:new Date().toISOString() });
    closeModal(); toast.show({type:'success', title:'Exception resolved'}); boot();
  });
}
function field(l,v){ return `<div class="field"><label>${l}</label><div class="input" style="display:flex;align-items:center;background:rgba(255,255,255,0.02);font-size:var(--fs-xs);">${v}</div></div>`; }
function showModal(html){
  document.getElementById('modal').innerHTML = html;
  document.getElementById('modalScrim').classList.add('show');
  document.getElementById('closeModal')?.addEventListener('click', closeModal);
  document.getElementById('cancelModal')?.addEventListener('click', closeModal);
}
function closeModal(){ document.getElementById('modalScrim').classList.remove('show'); }
document.getElementById('modalScrim').addEventListener('click', (e)=>{ if(e.target.id==='modalScrim') closeModal(); });

boot();


}

      <div class="table-wrap" style="max-height:340px;overflow-y:auto;border:1px solid var(--border);border-radius:10px;">

          <tr data-id="${s.id}" style="cursor:pointer;">
            <td style="width:34px;"><input type="radio" name="staffPick" class="checkbox" ${selStaff?.id===s.id?'checked':''}/></td>
            <td><b>${s.name}</b><div class="cell-sub mono">${s.id}</div></td>
            <td>${s.category.replace('_',' ')}</td>
          </tr>`).join('')}
        </tbody></table>
      </div>`;
    body.querySelectorAll('tr').forEach(tr=> tr.addEventListener('click', ()=>{ selStaff = staff.find(s=>s.id===tr.dataset.id); renderStep(); }));
    nextBtn.disabled = !selStaff;
  }
  if(step===1){
    body.innerHTML = `<div class="section-title">${STEPS[1]}</div>
      <div class="card-grid" style="grid-template-columns:1fr 1fr;">
        ${devices.map(d=> `
        <div data-id="${d.id}" class="panel" style="padding:14px;cursor:pointer;border-color:${selDevice?.id===d.id?'var(--accent)':'var(--border)'};">
          <div class="flex-between mb-8"><b style="font-size:var(--fs-sm);">${d.name}</b><span class="badge badge-${d.connectionStatus==='CONNECTED'?'success':'neutral'}">${d.connectionStatus}</span></div>
          <div class="cell-sub mono">${d.model} · ${d.ip}</div>
        </div>`).join('')}
      </div>`;
    body.querySelectorAll('[data-id]').forEach(el=> el.addEventListener('click', ()=>{ selDevice = devices.find(d=>d.id===el.dataset.id); renderStep(); }));
    nextBtn.disabled = !selDevice;
  }
  if(step===2){
    body.innerHTML = `<div style="text-align:center;padding:20px 0;">
      <div class="enroll-icon">${icon('fingerprint')}</div>
      <h3 style="margin-bottom:8px;">Ready to enroll ${selStaff.name}</h3>
      <p class="text-tertiary" style="font-size:var(--fs-sm);max-width:420px;margin:0 auto;">Enrollment will register a new biometric identifier for this worker on <b>${selDevice.name}</b>. Ensure the worker is present at the device before continuing.</p>
    </div>`;
  }
  if(step===3){
    body.innerHTML = statusStep('Device Ready', 'Preparing device for capture…', true);
    setTimeout(()=> autoAdvance(), 1100);
  }
  if(step===4){
    body.innerHTML = statusStep('Capture Biometric', 'Waiting for the worker to place their finger / face at the device…', true, true);
    setTimeout(()=> autoAdvance(), 1400);
  }
  if(step===5){
    body.innerHTML = statusStep('Verify Identity', 'Confirming capture quality and matching against existing records…', true);
    setTimeout(()=> autoAdvance(), 1200);
  }
  if(step===6){
    body.innerHTML = `<div style="text-align:center;padding:20px 0;">
      <div class="enroll-icon" style="background:var(--success-soft);color:var(--success);">${icon('checkCircle')}</div>
      <h3 style="margin-bottom:8px;">Biometric captured successfully</h3>
      <p class="text-tertiary" style="font-size:var(--fs-sm);">Confirm to finalize enrollment and synchronize the new identifier to the device.</p>
    </div>`;
  }
  if(step===7){
    body.innerHTML = statusStep('Synchronize', 'Pushing enrollment to device and updating the staff record…', true);
    deviceManager.syncUsers(selDevice).then(()=> setTimeout(()=> autoAdvance(), 900));
  }
  if(step===8){
    body.innerHTML = `<div style="text-align:center;padding:24px 0;">
      <div class="enroll-icon" style="background:var(--success-soft);color:var(--success);">${icon('check')}</div>
      <h3 style="margin-bottom:8px;">Enrollment complete</h3>
      <p class="text-tertiary" style="font-size:var(--fs-sm);">${selStaff.name} is now enrolled on ${selDevice.name}. This device record will reflect the updated enrolled-user count.</p>
      <a class="btn btn-secondary btn-sm" href="#workforce-staff" style="margin-top:16px;">Back to Labour Staff</a>
    </div>`;
    nextBtn.style.display = 'none'; backBtn.style.display = 'none';
  }
}

function statusStep(title, desc, pulsing, showBadge){
  return `<div style="text-align:center;padding:20px 0;">
    <div class="enroll-icon ${pulsing?'pulsing':''}">${icon('fingerprint')}</div>
    <h3 style="margin-bottom:8px;">${title}</h3>
    <p class="text-tertiary" style="font-size:var(--fs-sm);max-width:420px;margin:0 auto;">${desc}</p>
    ${showBadge ? `<span class="badge badge-neutral" style="margin-top:14px;">DEVELOPMENT SIMULATION</span>`:''}
  </div>`;
}
function autoAdvance(){ if(step<STEPS.length-1){ step++; renderStep(); } }

document.getElementById('nextBtn').addEventListener('click', ()=>{
  if(step < STEPS.length-1){ step++; renderStep(); }
});
document.getElementById('backBtn').addEventListener('click', ()=>{ if(step>0){ step--; renderStep(); } });

boot();


}

async function init_biometric_terminal(){

const stageMeta = {
  AUTH_RECEIVED:      { label:'Authentication received', icon:'scan' },
  IDENTITY_VERIFICATION: { label:'Identity verification', icon:'fingerprint' },
  EMPLOYEE_IDENTIFIED: { label:'Employee identified', icon:'users' },
  WAREHOUSE_VALIDATED: { label:'Warehouse / device validated', icon:'building' },
  ATTENDANCE_LOGGED:   { label:'Attendance event logged', icon:'clock' },
  DB_SYNCED:           { label:'Database synchronized', icon:'server' },
};
const STAGES = Object.keys(stageMeta);

let devices = [], staff = [], warehouses = [], currentDevice = null, stopSim = null;

async function boot(){
  document.getElementById('devBanner').innerHTML = devModeBanner();
  [devices, staff, warehouses] = await Promise.all([api.listDevices(), api.listStaff(), api.listWarehouses()]);
  const sel = document.getElementById('deviceSelect');

  if(!devices.length){
    document.getElementById('termSide').innerHTML = '';
    document.getElementById('termStream').innerHTML = offlineHtml('No devices registered', 'Register a biometric device to open its live terminal.');
    sel.innerHTML = `<option>No devices available</option>`;
    return;
  }

  sel.innerHTML = devices.map(d=> `<option value="${d.id}">${d.name}</option>`).join('');
  const params = currentRouteParams();
  const preselect = params.get('device');
  sel.value = devices.find(d=>d.id===preselect) ? preselect : devices[0].id;
  sel.addEventListener('change', ()=> selectDevice(sel.value));
  selectDevice(sel.value);
}

function offlineHtml(title, sub){
  return `<div class="device-offline">
    <div class="state-icon offline">${icon('wifi')}</div>
    <h3>${title}</h3><p>${sub}</p>
  </div>`;
}

function selectDevice(id){
  if(stopSim) stopSim();
  currentDevice = devices.find(d=>d.id===id);
  const wh = warehouses.find(w=>w.id===currentDevice.warehouseId);
  document.getElementById('deviceTitle').textContent = currentDevice.name;
  document.getElementById('deviceSub').textContent = `${currentDevice.model} · ${currentDevice.ip}:${currentDevice.port}`;
  const liveGateway = deviceConfig.isGatewayConfigured();
  document.getElementById('modeBadge').textContent = liveGateway ? 'LIVE DEVICE MODE' : 'DEVELOPMENT MODE';
  document.getElementById('modeBadge').className = `badge badge-${liveGateway?'accent':'neutral'}`;

  renderSide(currentDevice, wh);

  const stream = document.getElementById('termStream');
  const pulse = document.getElementById('pulseDot');

  if(currentDevice.connectionStatus === 'DISCONNECTED' || currentDevice.connectionStatus === 'ERROR'){
    pulse.style.color = 'var(--error)'; pulse.style.background = 'var(--error)';
    stream.innerHTML = offlineHtml('DEVICE OFFLINE', 'This terminal is not connected. Reconnect it from Biometric Devices, or continue in simulation mode below for development purposes.');
    stream.innerHTML += `<div style="text-align:center;"><button class="btn btn-secondary btn-sm" id="simAnyway">Run development simulation</button></div>`;
    document.getElementById('simAnyway')?.addEventListener('click', startStream);
    return;
  }
  pulse.style.color = 'var(--success)'; pulse.style.background = 'var(--success)';
  stream.innerHTML = '';
  startStream();
}

function renderSide(d, wh){
  document.getElementById('termSide').innerHTML = `
    <div class="section-title">Device Status</div>
    ${row('Connection', d.connectionStatus)}
    ${row('Warehouse', wh ? wh.name : '—')}
    ${row('Device time', new Date().toLocaleTimeString())}
    ${row('Last synchronization', new Date(d.lastSync).toLocaleString())}
    ${row('Network status', d.connectionStatus==='CONNECTED' ? 'Reachable':'Unreachable')}
    ${row('Database sync', 'Up to date')}
    <div class="divider"></div>
    <div class="section-title">Mode</div>
    <p class="text-tertiary" style="font-size:var(--fs-xs);line-height:1.6;">
      ${deviceConfig.isGatewayConfigured()
        ? 'Connected to a configured device gateway. Events shown are forwarded from real hardware.'
        : 'No device gateway is configured. Events below are generated locally for development and are clearly labeled — they are never presented as real hardware events.'}
    </p>`;
  function row(l,v){ return `<div class="term-stat"><span>${l}</span><b>${v}</b></div>`; }
}

function startStream(){
  const stream = document.getElementById('termStream');
  stream.innerHTML = '';
  stopSim = deviceManager.startSimulationStream(currentDevice, (evt)=> renderEvent(evt));
}

let eventCounter = 0;
function renderEvent(evt){
  const stream = document.getElementById('termStream');
  eventCounter++;
  if(evt.stage === 'AUTH_RECEIVED'){
    const randomStaff = staff.filter(s=> s.warehouseId===currentDevice.warehouseId && s.biometricEnrolled);
    const person = randomStaff.length ? randomStaff[Math.floor(Math.random()*randomStaff.length)] : null;
    const card = document.createElement('div');
    card.className = 'evt';
    card.dataset.evtId = eventCounter;
    card.innerHTML = `
      <div class="evt-head">
        <div style="display:flex;align-items:center;gap:8px;">
          <span class="avatar-sm">${person ? person.name.split(' ').map(n=>n[0]).join('') : '?'}</span>
          <div><div style="font-size:var(--fs-sm);font-weight:550;">${person ? person.name : 'Unidentified biometric ID'}</div><div class="cell-sub mono">${new Date(evt.timestamp).toLocaleTimeString()} · ${evt.simulated?'SIMULATED':'LIVE'}</div></div>
        </div>
        <span class="badge badge-info">Processing</span>
      </div>
      <div class="evt-steps">${STAGES.map(()=> `<div class="evt-step"><div></div></div>`).join('')}</div>
      <div class="evt-label" id="evt-label-${eventCounter}">${stageMeta.AUTH_RECEIVED.label}</div>`;
    stream.prepend(card);
    while(stream.children.length > 12) stream.removeChild(stream.lastChild);
    advanceStep(card, 0);
    return;
  }
  const card = stream.querySelector(`[data-evt-id="${eventCounter}"]`);
  if(!card) return;
  const idx = STAGES.indexOf(evt.stage);
  advanceStep(card, idx);
  if(evt.stage === 'DB_SYNCED'){
    card.querySelector('.badge').outerHTML = `<span class="badge badge-success">Complete</span>`;
  }
}
function advanceStep(card, idx){
  const steps = card.querySelectorAll('.evt-step');
  steps.forEach((s,i)=>{ if(i<=idx) s.classList.add('done'); });
  const label = card.querySelector('[id^="evt-label-"]');
  if(label && stageMeta[STAGES[idx]]) label.textContent = stageMeta[STAGES[idx]].label;
}

boot();


  return ()=>{ if(stopSim) stopSim(); };
}

async function init_cost_analytics(){

async function boot(){
  document.getElementById('devBanner').innerHTML = devModeBanner();
  const [accruals, vendors, staff] = await Promise.all([api.listAccruals(), api.listVendors(), api.listStaff()]);
  if(!accruals.length){
    document.querySelectorAll('.panel-body').forEach(p=> p.innerHTML = `<div class="state-block" style="padding:24px 10px;"><div class="state-icon">${icon('trending')}</div><h3>No cost data yet</h3><p>Load development data from the Overview page to preview analytics.</p></div>`);
    return;
  }

  // Trend: bucket by day
  const byDay = {};
  accruals.forEach(a=>{ const d = new Date(a.date).toLocaleDateString('en-IN',{weekday:'short'}); byDay[d]=(byDay[d]||0)+a.total; });
  const days = Object.keys(byDay);
  const max = Math.max(...Object.values(byDay), 1);
  document.getElementById('trendChart').innerHTML = days.map(d=> `
    <div class="bar" style="height:${Math.max(6,(byDay[d]/max)*160)}px;"><span class="bar-label">${d}</span></div>`).join('');

  // Category donut (via CSS conic-gradient)
  const catTotals = { SKILLED:0, SEMI_SKILLED:0, UNSKILLED:0 };
  accruals.forEach(a=>{
    const s = staff.find(s=>s.id===a.staffId);
    if(s) catTotals[s.category] += a.total;
  });
  const total = Object.values(catTotals).reduce((a,b)=>a+b,0) || 1;
  const colors = { SKILLED:'#7C6FFF', SEMI_SKILLED:'#60A5FA', UNSKILLED:'#2DD4BF' };
  let acc = 0;
  const stops = Object.entries(catTotals).map(([k,v])=>{
    const pct = v/total*100; const seg = `${colors[k]} ${acc}% ${acc+pct}%`; acc+=pct; return seg;
  }).join(', ');
  document.getElementById('catDonut').innerHTML = `
    <div style="display:flex;align-items:center;gap:24px;">
      <div style="width:130px;height:130px;border-radius:50%;background:conic-gradient(${stops});flex-shrink:0;position:relative;">
        <div style="position:absolute;inset:18px;border-radius:50%;background:var(--bg-raised);"></div>
      </div>
      <div>${Object.entries(catTotals).map(([k,v])=> `
        <div style="display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:8px;font-size:var(--fs-xs);">
          <span><span class="legend-dot" style="background:${colors[k]}"></span>${k.replace('_',' ')}</span>
          <span class="mono">₹${Math.round(v).toLocaleString('en-IN')}</span>
        </div>`).join('')}</div>
    </div>`;

  // Vendor bars
  const byVendor = {};
  accruals.forEach(a=>{ const s = staff.find(s=>s.id===a.staffId); if(!s) return; byVendor[s.vendorId]=(byVendor[s.vendorId]||0)+a.total; });
  const top = Object.entries(byVendor).sort((a,b)=>b[1]-a[1]).slice(0,5);
  const vmax = Math.max(...top.map(t=>t[1]),1);
  document.getElementById('vendorBars').innerHTML = top.map(([id,v])=>{
    const name = vendors.find(x=>x.id===id)?.name || 'Unknown';
    return `<div class="mb-12"><div class="flex-between" style="font-size:var(--fs-xs);margin-bottom:5px;"><span>${name}</span><span class="mono">₹${Math.round(v).toLocaleString('en-IN')}</span></div><div class="progress"><div style="width:${(v/vmax)*100}%;background:var(--accent-2);"></div></div></div>`;
  }).join('');

  // OT & service
  const ot = accruals.reduce((s,a)=>s+a.overtimeComp,0), svc = accruals.reduce((s,a)=>s+a.serviceCharge,0), base = accruals.reduce((s,a)=>s+a.baseWage,0);
  document.getElementById('otService').innerHTML = `
    <div class="mb-16">${bar('Base Wage', base, base, 'var(--info)')}</div>
    <div class="mb-16">${bar('Overtime Compensation', ot, base, 'var(--warning)')}</div>
    <div>${bar('Service Charge', svc, base, 'var(--accent-2)')}</div>`;
  function bar(label,val,ref,color){
    return `<div class="flex-between" style="font-size:var(--fs-xs);margin-bottom:5px;"><span>${label}</span><span class="mono">₹${Math.round(val).toLocaleString('en-IN')}</span></div><div class="progress"><div style="width:${Math.min(100,(val/ref)*100)}%;background:${color};"></div></div>`;
  }
}
boot();


}

async function init_index(){

const seedBtn = document.getElementById('seedBtn');
const wipeBtn = document.getElementById('wipeBtn');

async function boot(){
  document.getElementById('devBanner').innerHTML = devModeBanner();
  const [warehouses, staff, structure, exceptions, accruals, devices] = await Promise.all([
    api.listWarehouses(), api.listStaff(), api.listStructure(), api.listExceptions(), api.listAccruals(), api.listDevices(),
  ]);

  if(warehouses.length === 0){
    seedBtn.style.display = '';
    wipeBtn.style.display = 'none';
    document.getElementById('dashboardBody').style.display = 'none';
    document.getElementById('emptyOverview').innerHTML = `
      <div class="panel state-block" style="padding:80px 24px;">
        <div class="state-icon">${icon('grid')}</div>
        <h3>No operational data yet</h3>
        <p>Connect your warehouses, vendors and staff records to populate the operations center — or load development data to explore the interface.</p>
        <button class="btn btn-primary mb-8" id="emptySeedBtn" style="margin-top:14px;">Load development data</button>
      </div>`;
    document.getElementById('emptySeedBtn').addEventListener('click', seed);
    return;
  }

  seedBtn.style.display = api.isDevMode() ? 'none' : '';
  wipeBtn.style.display = api.isDevMode() ? '' : 'none';
  document.getElementById('emptyOverview').innerHTML = '';
  document.getElementById('dashboardBody').style.display = '';

  renderSnapshot(warehouses, staff);
  renderAttendance(staff, exceptions);
  renderAlerts(exceptions, devices, warehouses);
  renderCost(accruals, warehouses);
  renderUtilization(structure);
  renderWarehouseTable(warehouses, staff, accruals);
}

function renderSnapshot(warehouses, staff){
  const approved = warehouses.reduce((s,w)=> s+w.approvedStrength, 0);
  const active = staff.filter(s=> s.status==='ACTIVE').length;
  const present = Math.round(active * 0.91);
  const adhoc = staff.filter(s=> s.deployment==='AD_HOC' && s.status==='ACTIVE').length;
  const variance = active - approved;

  const cards = [
    { label:'Approved Workforce', value: approved, icon:'layers', color:'var(--accent)' },
    { label:'Active Workforce', value: active, icon:'users', color:'var(--info)' },
    { label:'Present Today', value: present, icon:'checkCircle', color:'var(--success)' },
    { label:'Ad-Hoc Workforce', value: adhoc, icon:'userPlus', color:'var(--accent-2)' },
    { label:'Workforce Variance', value: (variance>=0?'+':'')+variance, icon:'trending', color: variance<0?'var(--error)':'var(--success)' },
  ];
  document.getElementById('wfSnapshot').innerHTML = cards.map(c=> `
    <div class="kpi-card">
      <div class="kpi-top">
        <span class="kpi-label">${c.label}</span>
        <span class="kpi-icon" style="background:${c.color}1f;color:${c.color};">${icon(c.icon)}</span>
      </div>
      <div class="kpi-value">${c.value.toLocaleString()}</div>
    </div>`).join('');
}

function renderAttendance(staff, exceptions){
  const active = staff.filter(s=> s.status==='ACTIVE');
  const present = Math.round(active.length*0.91);
  const absent = active.length - present;
  const late = Math.round(present*0.06);
  const ot = Math.round(present*0.11);
  const unverified = staff.filter(s=> !s.verified).length;
  const openExc = exceptions.filter(e=> e.status==='OPEN').length;

  const rows = [
    ['Present', present, 'success'], ['Absent', absent, 'error'], ['Exceptions', openExc, 'warning'],
    ['Late Arrivals', late, 'warning'], ['Overtime', ot, 'info'], ['Unverified', unverified, 'neutral'],
  ];
  document.getElementById('attendanceIntel').innerHTML = `
    <div class="card-grid" style="grid-template-columns:repeat(3,1fr);">
      ${rows.map(([label,val,tone])=> `
        <div style="padding:12px 14px;border-radius:10px;background:rgba(255,255,255,0.03);border:1px solid var(--border-soft);">
          <div class="badge badge-${tone}" style="margin-bottom:8px;">${label}</div>
          <div style="font-family:var(--font-mono);font-size:20px;font-weight:650;">${val}</div>
        </div>`).join('')}
    </div>`;
}

function renderAlerts(exceptions, devices, warehouses){
  const alerts = [];
  exceptions.filter(e=>e.status==='OPEN').slice(0,6).forEach(e=>{
    const wh = warehouses.find(w=>w.id===e.warehouseId);
    alerts.push({ sev: e.type==='WORKFORCE_LIMIT_EXCEEDED'?'CRITICAL':'HIGH', title:e.type.replaceAll('_',' '), sub:`${wh?wh.name:'Unknown warehouse'} · Attendance exception` });
  });
  devices.filter(d=>d.connectionStatus==='ERROR').forEach(d=>{
    const wh = warehouses.find(w=>w.id===d.warehouseId);
    alerts.push({ sev:'CRITICAL', title:`Device error — ${d.name}`, sub:`${wh?wh.name:''} · Biometric terminal offline` });
  });
  warehouses.filter(w=> w.actualStrength < w.approvedStrength*0.85).forEach(w=>{
    alerts.push({ sev:'MEDIUM', title:`Workforce shortfall — ${w.name}`, sub:`Actual strength below 85% of approved` });
  });

  if(!alerts.length){
    document.getElementById('alertsList').innerHTML = `<div class="state-block" style="padding:40px 20px;"><div class="state-icon">${icon('checkCircle')}</div><h3>No active alerts</h3><p>All operational thresholds are within range.</p></div>`;
    return;
  }
  const sevColor = { CRITICAL:'error', HIGH:'warning', MEDIUM:'info' };
  document.getElementById('alertsList').innerHTML = alerts.slice(0,8).map(a=> `
    <div style="display:flex;gap:10px;padding:12px 16px;border-bottom:1px solid var(--border-soft);align-items:flex-start;">
      <span class="badge badge-${sevColor[a.sev]}" style="margin-top:2px;">${a.sev}</span>
      <div style="min-width:0;"><div style="font-size:var(--fs-sm);font-weight:550;">${a.title}</div><div style="font-size:var(--fs-xs);color:var(--text-tertiary);margin-top:2px;">${a.sub}</div></div>
    </div>`).join('');
}

function renderCost(accruals, warehouses){
  const today = accruals.filter(a=> new Date(a.date) > new Date(Date.now()-864e5));
  const todayTotal = today.reduce((s,a)=>s+a.total,0);
  const mtd = accruals.reduce((s,a)=>s+a.total,0);
  const projected = Math.round(mtd * (30/7));
  const actual = mtd;
  const variance = actual - projected*0.23;

  document.getElementById('costIntel').innerHTML = `
    <div class="card-grid" style="grid-template-columns:repeat(4,1fr);margin-bottom:16px;">
      ${[["Today's Accrual",todayTotal],['Month-to-Date',mtd],['Projected (Month)',projected],['Cost Variance',variance]].map(([l,v])=> `
        <div>
          <div class="kpi-label mb-8">${l}</div>
          <div class="mono" style="font-size:18px;font-weight:650;">₹${Math.round(v).toLocaleString('en-IN')}</div>
        </div>`).join('')}
    </div>
    <div class="progress mb-8"><div style="width:${Math.min(100,(mtd/projected)*100).toFixed(0)}%"></div></div>
    <div style="font-size:var(--fs-xs);color:var(--text-tertiary);">${((mtd/projected)*100).toFixed(1)}% of monthly projection consumed</div>`;
}

function renderUtilization(structure){
  const approved = structure.reduce((s,x)=>s+x.approved,0);
  const actual = structure.reduce((s,x)=>s+x.actual,0);
  const pct = approved ? Math.min(100, Math.round((actual/approved)*100)) : 0;
  document.getElementById('utilPanel').innerHTML = `
    <div style="display:flex;align-items:center;justify-content:center;padding:8px 0 16px;">
      <div style="position:relative;width:150px;height:150px;">
        <svg width="150" height="150" viewBox="0 0 150 150">
          <circle cx="75" cy="75" r="64" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="12"/>
          <circle cx="75" cy="75" r="64" fill="none" stroke="url(#g1)" stroke-width="12" stroke-linecap="round"
            stroke-dasharray="${2*Math.PI*64}" stroke-dashoffset="${2*Math.PI*64*(1-pct/100)}" transform="rotate(-90 75 75)"/>
          <defs><linearGradient id="g1" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#7C6FFF"/><stop offset="100%" stop-color="#2DD4BF"/></linearGradient></defs>
        </svg>
        <div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;">
          <div style="font-size:26px;font-weight:700;font-family:var(--font-mono);">${pct}%</div>
          <div style="font-size:10px;color:var(--text-tertiary);text-transform:uppercase;letter-spacing:0.05em;">Utilized</div>
        </div>
      </div>
    </div>
    <div class="flex-between" style="font-size:var(--fs-xs);color:var(--text-tertiary);"><span>Approved: ${approved}</span><span>Actual: ${actual}</span></div>`;
}

function renderWarehouseTable(warehouses, staff, accruals){
  const rows = warehouses.map(w=>{
    const active = staff.filter(s=>s.warehouseId===w.id && s.status==='ACTIVE');
    const adhoc = active.filter(s=>s.deployment==='AD_HOC').length;
    const cost = accruals.filter(a=>a.warehouseId===w.id).reduce((s,a)=>s+a.total,0);
    const variance = active.length - w.approvedStrength;
    return { id:w.id, name:w.name, code:w.code, approved:w.approvedStrength, actual:active.length,
      attendance: active.length ? Math.round((active.length*0.91/active.length)*100)+'%':'—',
      adhoc, cost, variance, status:w.status };
  });
  createDataTable(document.getElementById('whTable'), {
    columns: [
      { key:'name', label:'Warehouse', sortable:true, render:r=> `<div><b>${r.name}</b><div class="cell-sub mono">${r.code}</div></div>` },
      { key:'approved', label:'Approved', sortable:true },
      { key:'actual', label:'Actual', sortable:true },
      { key:'attendance', label:'Attendance' },
      { key:'adhoc', label:'Ad-Hoc', sortable:true },
      { key:'cost', label:'Cost (MTD)', sortable:true, render:r=> `<span class="mono">₹${r.cost.toLocaleString('en-IN')}</span>` },
      { key:'variance', label:'Variance', sortable:true, render:r=> `<span style="color:${r.variance<0?'var(--error)':'var(--success)'}">${r.variance>=0?'+':''}${r.variance}</span>` },
      { key:'status', label:'Status', render:r=> `<span class="badge badge-${r.status==='OPERATIONAL'?'success':r.status==='SETUP'?'info':'warning'}">${r.status}</span>` },
    ],
    rows, getId:r=>r.id, pageSize:8, searchKeys:['name','code'],
    onRowClick: ()=> location.href='admin-warehouses.html',
  });
}
