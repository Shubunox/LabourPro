async function init_workforce_structure(){

const catColor = { SKILLED:'var(--accent)', SEMI_SKILLED:'var(--info)', UNSKILLED:'var(--accent-2)' };

async function boot(){
  document.getElementById('devBanner').innerHTML = devModeBanner();
  const [structure, warehouses] = await Promise.all([api.listStructure(), api.listWarehouses()]);
  document.getElementById('seedBtn').style.display = structure.length ? 'none':'';

  if(!structure.length){
    document.getElementById('body').innerHTML = `<div class="panel state-block" style="padding:70px 20px;"><div class="state-icon">${icon('layers')}</div><h3>No labour structure defined</h3><p>Define approved workforce per warehouse and category, or load development data to preview this workspace.</p></div>`;
    return;
  }

  document.getElementById('body').innerHTML = warehouses.map(w=>{
    const rows = structure.filter(s=>s.warehouseId===w.id);
    if(!rows.length) return '';
    return `<div class="panel mb-16">
      <div class="panel-head"><div><h3>${w.name}</h3><div class="desc">${w.code}</div></div></div>
      <div class="panel-body">
        <div class="card-grid" style="grid-template-columns:repeat(3,1fr);">
          ${rows.map(r=>{
            const avail = r.allocated - r.actual;
            const variance = r.actual - r.approved;
            const pct = Math.min(100, Math.round((r.actual/r.approved)*100));
            return `<div style="border:1px solid var(--border);border-radius:12px;padding:14px 16px;">
              <div class="flex-between mb-10">
                <span class="badge" style="background:${catColor[r.category]}22;color:${catColor[r.category]};">${r.category.replace('_',' ')}</span>
                <span style="font-size:var(--fs-xs);color:${variance<0?'var(--error)':'var(--success)'}">${variance>=0?'+':''}${variance}</span>
              </div>
              <div class="progress mb-10"><div style="width:${pct}%;background:${catColor[r.category]};"></div></div>
              <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:6px;font-size:10.5px;color:var(--text-tertiary);text-align:center;">
                <div><b class="mono" style="display:block;color:var(--text-primary);font-size:13px;">${r.approved}</b>Approved</div>
                <div><b class="mono" style="display:block;color:var(--text-primary);font-size:13px;">${r.allocated}</b>Allocated</div>
                <div><b class="mono" style="display:block;color:var(--text-primary);font-size:13px;">${r.actual}</b>Actual</div>
                <div><b class="mono" style="display:block;color:var(--text-primary);font-size:13px;">${avail}</b>Available</div>
              </div>
            </div>`;
          }).join('')}
        </div>
      </div>
    </div>`;
  }).join('');
}

ROUTES['#workforce-adhoc'] = { html: '\n      <div id="devBanner"></div>\n      <div class="page-header">\n        <div><h1>Ad-Hoc Labour</h1><div class="sub">Request temporary workforce beyond approved structure. Requests are evaluated against approved capacity automatically.</div></div>\n        <div class="page-header-actions">\n          <button class="btn btn-secondary" id="seedBtn">Load development data</button>\n          <button class="btn btn-primary" id="newBtn">New request</button>\n        </div>\n      </div>\n      <div class="panel"><div class="panel-body no-pad" id="tableRoot"></div></div>\n    \n<div class="modal-scrim" id="modalScrim"><div class="modal">\n  <div class="panel-head"><h3>New ad-hoc request</h3><button class="icon-btn" id="closeModal"></button></div>\n  <div class="panel-body">\n    <div class="card-grid mb-16" style="grid-template-columns:1fr 1fr;">\n      <div class="field"><label>Warehouse <span class="req">*</span></label><select class="select" id="whSel"></select></div>\n      <div class="field"><label>Vendor <span class="req">*</span></label><select class="select" id="venSel"></select></div>\n    </div>\n    <div class="card-grid mb-16" style="grid-template-columns:1fr 1fr;">\n      <div class="field"><label>Category <span class="req">*</span></label><select class="select"><option>SKILLED</option><option>SEMI_SKILLED</option><option>UNSKILLED</option></select></div>\n      <div class="field"><label>Required quantity <span class="req">*</span></label><input class="input" type="number" placeholder="e.g. 15"/></div>\n    </div>\n    <div class="card-grid mb-16" style="grid-template-columns:1fr 1fr;">\n      <div class="field"><label>Start date</label><input type="date" class="input"/></div>\n      <div class="field"><label>End date</label><input type="date" class="input"/></div>\n    </div>\n    <div class="field"><label>Reason <span class="req">*</span></label><textarea class="input" placeholder="e.g. Seasonal peak volume surge"></textarea></div>\n    <div class="hint" style="margin-top:8px;">If the request exceeds approved structure headroom, it will automatically route to the configured approval chain.</div>\n  </div>\n  <div class="drawer-foot" style="border-top:1px solid var(--border-soft);"><button class="btn btn-secondary" id="cancelModal">Cancel</button><button class="btn btn-primary" id="submitReq">Submit request</button></div>\n</div></div>', init: init_workforce_adhoc };
ROUTES['#workforce-staff'] = { html: '\n      <div id="devBanner"></div>\n      <div class="page-header">\n        <div><h1>Labour Staff</h1><div class="sub">Registration, verification, wage configuration and biometric enrollment for every worker across your network.</div></div>\n        <div class="page-header-actions">\n          <button class="btn btn-secondary" id="seedBtn">Load development data</button>\n          <button class="btn btn-primary" id="addStaffBtn">Register staff</button>\n        </div>\n      </div>\n      <div class="panel">\n        <div class="panel-body no-pad" id="tableRoot"></div>\n      </div>\n    \n<div class="drawer-scrim" id="drawerScrim"><div class="drawer" id="drawer"></div></div>', init: init_workforce_staff };

mit for approval</button></div>\n</div></div>', init: init_workforce_transfers };
